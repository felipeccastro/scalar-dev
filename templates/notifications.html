%rebase('layout', title='Notifications')
<div class="page-header">
  <h1>Notifications</h1>
  <form method="post" action="{{url_for('notifications_read_all')}}">
    <input type="hidden" name="_csrf_token" value="{{csrf_token()}}">
    <button class="btn" type="submit">Mark all read</button>
  </form>
</div>

%if notifications:
  <ul class="plain-list">
    %for n in notifications:
      <li class="{{'is-unread' if not n.read_at else ''}}">
        <span class="badge">{{n.kind}}</span> {{notification_summary(n)}}
        <span class="muted">&middot; {{n.created_at.strftime('%b %d, %H:%M')}}</span>
        %if not n.read_at:
          <form method="post" action="{{url_for('notification_read', notification_id=n.id)}}" class="inline-form">
            <input type="hidden" name="_csrf_token" value="{{csrf_token()}}">
            <button class="btn-link" type="submit">Mark read</button>
          </form>
        %end
      </li>
    %end
  </ul>
%else:
  <p class="muted">No notifications yet.</p>
%end
